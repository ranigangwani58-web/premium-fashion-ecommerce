```
<div class="contact-page">

    <h1>Contact Us</h1>

    <form
        action="mailto:your@email.com"
        method="post"
    >

        <input
            type="text"
            name="Name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="Email"
            placeholder="Your Email"
            required
        >

        <input
            type="text"
            name="Subject"
            placeholder="Subject"
        >

        <textarea
            name="Message"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>
